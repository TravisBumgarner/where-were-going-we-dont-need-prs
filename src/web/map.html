<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rules Map</title>
<style>
  :root {
    --bg: #eeede8; --bar: #fbfaf7; --text: #1d1d1b; --muted: #6b6b66; --border: #dcdbd4;
    --node: #fbfaf7; --node-2: #f4f3ee; --card: #ffffff; --accent: #2f5bd3; --focus: #2f5bd3;
    --ok: #1e6b34; --bad: #a4291b; --node-l: 45%; --node-tint: 96%;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211; --bar: #1b1b19; --text: #ececE8; --muted: #9a9a93; --border: #33332f;
      --node: #1c1c1a; --node-2: #232320; --card: #2a2a27; --accent: #7d9cff; --focus: #7d9cff;
      --ok: #8fdca8; --bad: #f2a193; --node-l: 65%; --node-tint: 14%;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  /* Top bar */
  .bar { position: fixed; inset: 0 0 auto 0; height: 52px; display: flex; align-items: center; gap: 16px;
    padding: 0 16px; background: var(--bar); border-bottom: 1px solid var(--border); z-index: 2; }
  .repo { font-weight: 700; white-space: nowrap; color: var(--text); text-decoration: none; }
  .label { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); white-space: nowrap; }
  .crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; flex: 1; font-size: 14px; }
  .crumbs button { all: unset; cursor: pointer; color: var(--muted); white-space: nowrap; padding: 2px 4px; border-radius: 4px; }
  .crumbs button:hover { color: var(--text); background: var(--node-2); }
  .crumbs button:last-child { color: var(--text); font-weight: 600; }
  .crumbs button:focus-visible { outline: 2px solid var(--focus); }
  .crumbs .sep { color: var(--muted); }
  .controls { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .controls label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .controls kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
  @media (max-width: 720px) { .hint { display: none; } }
  .tabs { display: flex; gap: 2px; background: var(--node-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .tabs button { all: unset; cursor: pointer; font-size: 13px; padding: 3px 10px; border-radius: 6px; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .15); }
  .tabs button:focus-visible { outline: 2px solid var(--focus); }
  body.view-table .stage, body.view-table .crumbs, body.view-table .hint { display: none; }
  body.view-map .table-view, body.view-map .filter { display: none; }
  .filter { flex: 1; max-width: 360px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 14px; }

  /* Hierarchy view */
  .table-view { position: fixed; inset: 52px 0 0 0; overflow: auto; }
  .table-inner { max-width: 1200px; margin: 0 auto; padding: 20px 16px 64px; }
  .table-tools { display: flex; gap: 8px; margin-bottom: 10px; font-size: 13px; color: var(--muted); align-items: center; }
  .table-tools button { all: unset; cursor: pointer; color: var(--accent); }
  .table-tools .spacer { flex: 1; }
  table.tree { width: 100%; border-collapse: collapse; background: var(--node); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; font-size: 14px; }
  table.tree th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--node-2); }
  table.tree td { padding: 8px 12px; border-top: 1px solid var(--border); vertical-align: top; }
  table.tree tr.node-row td { background: var(--node-2); }
  table.tree tr.node-row td:first-child { box-shadow: inset 4px 0 0 hsl(var(--hue) 55% var(--node-l)); }
  table.tree tr.rule-row { cursor: pointer; }
  table.tree tr.rule-row:hover td { background: color-mix(in srgb, var(--card) 70%, transparent); }
  table.tree tr.hidden { display: none; }
  body:not(.show-retired) table.tree tr.retired { display: none; }
  table.tree tr.retired td { opacity: .55; }
  .name { display: flex; align-items: baseline; gap: 6px; }
  .chev { all: unset; cursor: pointer; width: 16px; color: var(--muted); flex: none; text-align: center; transition: transform .15s; }
  .chev.collapsed { transform: rotate(-90deg); }
  .chev:focus-visible { outline: 2px solid var(--focus); border-radius: 3px; }
  .node-title { font-weight: 700; }
  .node-path { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
  .muted { color: var(--muted); }
  .mono { font: 12.5px ui-monospace, Menlo, monospace; white-space: nowrap; }
  .clip { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .pill { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; }
  .pill.active { color: var(--ok, #1e6b34); } .pill.retired { color: var(--muted); }
  tr.detail td { background: var(--card); }
  .detail-body { padding: 4px 0 6px 22px; display: grid; gap: 6px; max-width: 820px; }
  .detail-body ul { margin: 0; padding: 0; list-style: none; }
  .detail-body .history { font-size: 12px; color: var(--muted); }
  mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 2px; }
  .none { padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 720px) {
    .col-status, .col-updated, .col-rule { display: none; }
    .bar { gap: 8px; padding: 0 10px; }
    .label, body.view-table .controls { display: none; }
    .filter { min-width: 0; }
  }

  /* Stage and world */
  .stage { position: fixed; inset: 52px 0 0 0; overflow: hidden; cursor: grab; touch-action: none; }
  .stage.dragging { cursor: grabbing; }
  .world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  /* will-change only while moving: left on, the browser keeps a blurry bitmap from the last scale. */
  .world.animating { transition: transform .7s cubic-bezier(.65, 0, .35, 1); will-change: transform; }

  /* Nodes: every node is laid out at full width, then scaled into its parent's grid cell. */
  .node { width: 1100px; padding: 40px; border-radius: 28px; background: var(--node);
    border: 2px solid hsl(var(--hue) 40% var(--node-l) / .35);
    box-shadow: inset 10px 0 0 hsl(var(--hue) 55% var(--node-l)); cursor: zoom-in; }
  .node.depth-odd { background: var(--node-2); }
  .node.is-focus { border-color: hsl(var(--hue) 55% var(--node-l)); cursor: default; }
  .node-head { margin-bottom: 28px; padding-left: 12px; }
  .eyebrow { font: 600 14px ui-monospace, Menlo, monospace; color: hsl(var(--hue) 45% var(--node-l)); letter-spacing: .02em; }
  .node-head h2 { font-size: 44px; line-height: 1.15; margin: 4px 0 10px; letter-spacing: -.01em; }
  .node-head p { font-size: 20px; color: var(--muted); margin: 0 0 10px; max-width: 900px; white-space: pre-line; }
  .counts { font-size: 14px; color: var(--muted); }
  .warn { color: var(--bad); font-size: 14px; }

  .rules { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 32px; padding-left: 12px; }
  .rules:empty { display: none; }
  .rule { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; cursor: zoom-in; }
  .rule.is-focus { outline: 3px solid var(--focus); outline-offset: 3px; cursor: zoom-out; }
  .rule.retired { opacity: .55; }
  body:not(.show-retired) .rule.retired { display: none; }
  .rule-id { font: 600 13px ui-monospace, Menlo, monospace; color: var(--muted); display: flex; gap: 8px; }
  .rule-id .status { text-transform: uppercase; letter-spacing: .05em; }
  .rule h3 { font-size: 20px; line-height: 1.3; margin: 4px 0 8px; }
  .rule .text { font-size: 16px; margin: 0 0 10px; }
  .rule .why { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
  .rule ul { margin: 0 0 8px; padding: 0; list-style: none; font-size: 14px; }
  .rule li { margin: 2px 0; }
  .rule .history { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 6px; margin-top: 8px; }

  .kids { display: grid; gap: 32px; padding-left: 12px; }

  /* Semantic zoom. The focused node and its ancestors are open; every other node is a tile
     (title, summary, counts) with its contents hidden. Rules are compact until focused. */
  .node.tile > .rules, .node.tile > .kids, .node.tile > .empty { display: none; }
  .node.tile .node-head { margin-bottom: 0; }
  .node.tile .eyebrow { font-size: 26px; }
  .node.tile .node-head h2 { font-size: 84px; margin: 8px 0 16px; }
  .node.tile .node-head p { font-size: 38px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .node.tile .counts { font-size: 30px; }
  .node.tile:hover { border-color: hsl(var(--hue) 55% var(--node-l)); }
  .node.context > .node-head { opacity: .55; }
  .node:not(.tile) > .rules, .node:not(.tile) > .kids { animation: reveal .35s ease-out; }
  @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
  .rule:not(.expanded) > :is(.text, .why, ul, .history) { display: none; }
  .rule:not(.expanded) h3 { margin-bottom: 0; }
  .rule.expanded > :is(.text, .why, ul, .history) { animation: reveal .35s ease-out; }
  .cell { position: relative; }
  .cell > .node { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

  .empty { font-size: 18px; color: var(--muted); padding-left: 12px; }
</style>
</head>
<body>
<div class="bar">
  <a class="repo" id="repo"></a><span class="label" id="label"></span>
  <div class="tabs" role="tablist" aria-label="View">
    <button role="tab" id="tab-map" data-view="map">Map</button>
    <button role="tab" id="tab-table" data-view="table">Hierarchy</button>
  </div>
  <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
  <input class="filter" id="filter" type="search" placeholder="Filter rules…" aria-label="Filter rules">
  <div class="controls">
    <label><input type="checkbox" id="show-retired"> Show retired</label>
    <span class="hint">click to zoom in · <kbd>esc</kbd> out · <kbd>←</kbd><kbd>→</kbd> tour · drag / scroll to pan</span>
  </div>
</div>
<div class="stage" id="stage"><div class="world" id="world"></div></div>
<div class="table-view" id="table-view"><div class="table-inner">
  <div class="table-tools"><span id="table-count"></span><span class="spacer"></span><button id="expand-all">Expand all</button>·<button id="collapse-all">Collapse all</button></div>
  <table class="tree">
    <thead><tr><th>Area / rule</th><th>ID</th><th class="col-status">Status</th><th class="col-rule">Rule</th><th class="col-updated">Updated</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div></div>
<script>
const DATA = /*__DATA__*/null;
const NODE_WIDTH = 1100, NODE_PAD = 40, INDENT = 12, KID_GAP = 32;

const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");
const stage = $("#stage"), world = $("#world");

// ---------- Render ----------

const HUES = [220, 150, 30, 280, 350, 190, 90, 320];
const countRules = (n) => n.rules.filter((r) => r.status !== "retired").length + n.children.reduce((a, c) => a + countRules(c), 0);

function renderRule(rule) {
  const el = document.createElement("article");
  el.className = `rule${rule.status === "retired" ? " retired" : ""}`;
  el.dataset.id = rule.id;
  el.innerHTML = `
    <div class="rule-id"><span>${esc(rule.id)}</span>${rule.status !== "active" ? `<span class="status">${esc(rule.status)}</span>` : ""}</div>
    <h3>${inline(rule.title)}</h3>
    ${rule.rule ? `<p class="text">${inline(rule.rule)}</p>` : ""}
    ${rule.why ? `<p class="why"><strong>Why:</strong> ${inline(rule.why)}</p>` : ""}
    ${rule.examples.length ? `<ul>${rule.examples.map((e) => `<li>${inline(e)}</li>`).join("")}</ul>` : ""}
    ${rule.history.length ? `<div class="history">${rule.history.map(inline).join("<br>")}</div>` : ""}`;
  return el;
}

function renderNode(node, depth, hue) {
  const el = document.createElement("section");
  el.className = `node${depth % 2 ? " depth-odd" : ""}`;
  el.dataset.path = node.path;
  el.style.setProperty("--hue", hue);
  const total = countRules(node);
  const areas = node.children.length;
  el.innerHTML = `
    <header class="node-head">
      <div class="eyebrow">${node.path ? esc(node.path) + "/" : "rules/"}</div>
      <h2>${inline(node.title)}</h2>
      ${node.summary ? `<p>${inline(node.summary)}</p>` : ""}
      <div class="counts">${total} rule${total === 1 ? "" : "s"}${areas ? ` · ${areas} area${areas === 1 ? "" : "s"}` : ""}</div>
      ${node.missingIndex ? `<div class="warn">Missing index.md</div>` : ""}
    </header>
    <div class="rules"></div>
    <div class="kids"></div>`;
  const rules = $(".rules", el);
  node.rules.forEach((r) => rules.append(renderRule(r)));
  const kids = $(".kids", el);
  const cols = node.children.length <= 1 ? 1 : node.children.length <= 4 ? 2 : 3;
  kids.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  kids.dataset.cols = cols;
  node.children.forEach((child, i) => {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.append(renderNode(child, depth + 1, depth === 0 ? HUES[(i + 1) % HUES.length] : hue));
    kids.append(cell);
  });
  if (!node.rules.length && !node.children.length) {
    kids.insertAdjacentHTML("beforebegin", `<p class="empty">No rules yet. <code>wit condense</code> adds them here.</p>`);
  }
  return el;
}

// Bottom-up: scale each child to fit its cell, then size the cell to the scaled height.
function layout(nodeEl) {
  const kids = $(":scope > .kids", nodeEl);
  const cols = Number(kids.dataset.cols);
  const inner = NODE_WIDTH - NODE_PAD * 2 - INDENT;
  const cellWidth = (inner - KID_GAP * (cols - 1)) / cols;
  const scale = cellWidth / NODE_WIDTH;
  for (const cell of kids.children) {
    const child = cell.firstElementChild;
    layout(child);
    child.style.transform = `scale(${scale})`;
    cell.style.height = `${child.offsetHeight * scale}px`;
  }
}

// ---------- Camera ----------

let cam = { x: 0, y: 0, s: 1 };
let focusEl = null;

world.addEventListener("transitionend", () => world.classList.remove("animating"));
function apply(animate) {
  world.classList.toggle("animating", animate);
  world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
}

// Element's box in world coordinates, measured against the camera's *current* on-screen transform.
function worldBox(el) {
  const t = getComputedStyle(world).transform;
  const m = t === "none" ? new DOMMatrix() : new DOMMatrix(t);
  const r = el.getBoundingClientRect(), st = stage.getBoundingClientRect();
  return { x: (r.left - st.left - m.e) / m.a, y: (r.top - st.top - m.f) / m.a, w: r.width / m.a, h: r.height / m.a };
}

// Opens the focused node and its ancestors; everything else collapses to a tile.
function applyDetail(target) {
  const focusNode = target.classList.contains("rule") ? target.closest(".node") : target;
  const chain = new Set();
  for (let n = focusNode; n; n = n.parentElement?.closest(".node")) chain.add(n);
  world.querySelectorAll(".node").forEach((n) => {
    n.classList.toggle("tile", !chain.has(n));
    n.classList.toggle("context", chain.has(n) && n !== focusNode);
  });
  world.querySelectorAll(".rule.expanded").forEach((r) => r !== target && r.classList.remove("expanded"));
  if (target.classList.contains("rule")) target.classList.add("expanded");
  layout(world.firstElementChild);
}

const visible = (el) => el.offsetParent !== null;
let pending;

// Zooming in: fly to the target as it looks now, then open it. Anything else: re-arrange
// first, keeping the previous focus framed, then fly to the target.
function focus(el, { animate = true, updateHash = true } = {}) {
  if (!el) return;
  clearTimeout(pending);
  const prev = focusEl;
  setFocus(el, updateHash);
  const zoomingIn = animate && prev && prev !== el && prev.contains(el) && visible(el);
  if (zoomingIn) {
    frame(el, true);
    pending = setTimeout(() => {
      applyDetail(el);
      frame(el, true);
    }, 720);
    return;
  }
  applyDetail(el);
  if (animate && prev && prev !== el && visible(prev)) {
    frame(prev, false);
    void world.offsetWidth; // start the flight from the re-arranged view
  }
  frame(el, animate);
}

function setFocus(el, updateHash) {
  focusEl?.classList.remove("is-focus");
  focusEl = el;
  el.classList.add("is-focus");
  renderCrumbs();
  if (updateHash) {
    const hash = el.classList.contains("rule") ? `#rule=${el.dataset.id}` : el.dataset.path ? `#node=${el.dataset.path}` : "";
    history.replaceState(null, "", hash || location.pathname);
  }
}

function frame(el, animate) {
  const b = worldBox(el);
  const W = stage.clientWidth, H = stage.clientHeight;
  const isRule = el.classList.contains("rule");
  // Nodes shrink to fit the screen, but never below half the screen width (then you pan).
  const s = isRule
    ? Math.min((W * 0.62) / b.w, (H * 0.8) / b.h, 4 / scaleOf(el))
    : Math.min((W * 0.94) / b.w, Math.max((H * 0.94) / b.h, (W * 0.5) / b.w));
  const fitsVertically = b.h * s <= H * 0.94;
  cam = {
    s,
    x: (W - b.w * s) / 2 - b.x * s,
    y: fitsVertically ? (H - b.h * s) / 2 - b.y * s : 24 - b.y * s,
  };
  apply(animate);
}

// Cumulative scale from nested cells, so rule cards zoom to a readable (not giant) size.
function scaleOf(el) {
  let s = 1;
  for (let n = el.closest(".node"); n; n = n.parentElement?.closest(".node")) {
    const t = n.style.transform.match(/scale\(([\d.]+)\)/);
    if (t) s *= Number(t[1]);
  }
  return s;
}

const parentOf = (el) => (el.classList.contains("rule") ? el.closest(".node") : el.parentElement?.closest(".node"));

function renderCrumbs() {
  const chain = [];
  for (let n = focusEl; n; n = parentOf(n)) chain.unshift(n);
  const crumbs = $("#crumbs");
  crumbs.innerHTML = "";
  chain.forEach((el, i) => {
    if (i) crumbs.insertAdjacentHTML("beforeend", `<span class="sep">›</span>`);
    const btn = document.createElement("button");
    btn.textContent = el.classList.contains("rule") ? el.dataset.id : $(":scope > .node-head h2", el).textContent;
    btn.addEventListener("click", () => focus(el));
    crumbs.append(btn);
  });
}

function fromHash({ animate }) {
  const params = new URLSearchParams(location.hash.slice(1));
  const target = params.get("rule")
    ? world.querySelector(`.rule[data-id="${CSS.escape(params.get("rule"))}"]`)
    : params.get("node") ? world.querySelector(`.node[data-path="${CSS.escape(params.get("node"))}"]`) : null;
  focus(target ?? world.firstElementChild, { animate, updateHash: false });
}

// ---------- Input ----------

let drag = null;
stage.addEventListener("pointerdown", (e) => {
  drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false };
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  if (!drag.moved) stage.setPointerCapture?.(e.pointerId);
  drag.moved = true;
  stage.classList.add("dragging");
  cam.x = drag.cx + dx;
  cam.y = drag.cy + dy;
  apply(false);
});
window.addEventListener("pointerup", () => {
  stage.classList.remove("dragging");
  setTimeout(() => (drag = null));
});

stage.addEventListener("click", (e) => {
  if (drag?.moved) return;
  const rule = e.target.closest(".rule");
  const node = e.target.closest(".node");
  if (rule) focus(rule === focusEl ? rule.closest(".node") : rule);
  else if (node && node !== focusEl) focus(node);
});

stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const st = stage.getBoundingClientRect();
    const px = e.clientX - st.left, py = e.clientY - st.top;
    const k = Math.exp(-e.deltaY * 0.01);
    cam = { s: cam.s * k, x: px - (px - cam.x) * k, y: py - (py - cam.y) * k };
  } else {
    cam.x -= e.deltaX;
    cam.y -= e.deltaY;
  }
  apply(false);
}, { passive: false });

// Every node and rule in reading order, whether or not it's currently collapsed.
const tour = () => [...world.querySelectorAll(".node, .rule")].filter((el) => !el.classList.contains("retired") || document.body.classList.contains("show-retired"));
window.addEventListener("keydown", (e) => {
  if ((e.target instanceof Element && e.target.matches("input, textarea")) || view !== "map") return;
  if (e.key === "Escape" || e.key === "Backspace") {
    const parent = focusEl && parentOf(focusEl);
    if (parent) focus(parent);
  } else if (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === " ") {
    e.preventDefault();
    const stops = tour();
    const i = stops.indexOf(focusEl);
    const next = stops[(i + (e.key === "ArrowLeft" ? -1 : 1) + stops.length) % stops.length];
    focus(next);
  } else if (e.key === "0" || e.key === "Home") {
    focus(world.firstElementChild);
  }
});

$("#show-retired").addEventListener("change", (e) => {
  document.body.classList.toggle("show-retired", e.target.checked);
  if (view !== "map") return;
  const target = focusEl.classList.contains("retired") && !e.target.checked ? focusEl.closest(".node") : focusEl;
  focus(target, { animate: false });
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => view === "map" && frame(focusEl, false), 100);
});
window.addEventListener("hashchange", () => view === "map" && fromHash({ animate: true }));

// ---------- Hierarchy view ----------

const lastUpdated = (rule) => rule.history.map((h) => h.match(/^\d{4}-\d{2}-\d{2}/)?.[0]).filter(Boolean).sort().at(-1) ?? "";
const highlight = (text, q) => {
  const safe = esc(text);
  if (!q) return safe;
  return safe.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
};
const tbody = $("#tbody");
const rows = []; // { tr, kind, path, parentPath, depth, rule?, node }

function buildTable() {
  const walk = (node, depth, parentPath, hue) => {
    const tr = document.createElement("tr");
    tr.className = "node-row";
    tr.style.setProperty("--hue", hue);
    const total = countRules(node);
    tr.innerHTML = `
      <td colspan="3"><div class="name" style="padding-left:${depth * 20}px">
        ${node.children.length || node.rules.length ? `<button class="chev" aria-label="Collapse ${esc(node.title)}" aria-expanded="true">▾</button>` : `<span class="chev"></span>`}
        <span class="node-title">${esc(node.title)}</span><span class="node-path">${node.path ? esc(node.path) + "/" : "rules/"}</span></div></td>
      <td class="muted col-rule"><span class="clip">${esc(node.summary)}</span></td>
      <td class="col-updated muted">${total} rule${total === 1 ? "" : "s"}</td>`;
    rows.push({ tr, kind: "node", path: node.path, parentPath, depth, node });
    tbody.append(tr);
    for (const rule of node.rules) {
      const r = document.createElement("tr");
      r.className = `rule-row${rule.status === "retired" ? " retired" : ""}`;
      r.dataset.id = rule.id;
      r.innerHTML = `
        <td><div class="name" style="padding-left:${depth * 20 + 22}px"><span class="rule-title"></span></div></td>
        <td class="mono">${esc(rule.id)}</td>
        <td class="col-status"><span class="pill ${esc(rule.status)}">${esc(rule.status)}</span></td>
        <td class="col-rule"><span class="clip rule-text"></span></td>
        <td class="col-updated mono muted">${esc(lastUpdated(rule))}</td>`;
      rows.push({ tr: r, kind: "rule", path: node.path, parentPath: node.path, depth, rule });
      tbody.append(r);
    }
    node.children.forEach((child, i) => walk(child, depth + 1, node.path, depth === 0 ? HUES[(i + 1) % HUES.length] : hue));
  };
  walk(DATA.tree, 0, null, HUES[0]);
}

const collapsed = new Set();
let openDetail = null;

function renderTable() {
  const q = $("#filter").value.trim().toLowerCase();
  const matches = (rule) => [rule.id, rule.title, rule.rule, rule.why, ...rule.examples].some((t) => (t ?? "").toLowerCase().includes(q));
  const showRetired = document.body.classList.contains("show-retired");
  // With a filter, show matching rules plus every ancestor node of a match; ignore collapsing.
  const keepNodes = new Set();
  if (q) {
    for (const row of rows) {
      if (row.kind !== "rule" || !matches(row.rule) || (row.rule.status === "retired" && !showRetired)) continue;
      for (let p = row.path; p != null; p = p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : p === "" ? null : "") keepNodes.add(p);
    }
  }
  const hiddenBy = (path) => {
    for (let p = path; p != null; p = p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : p === "" ? null : "") if (collapsed.has(p)) return true;
    return false;
  };
  let shown = 0;
  for (const row of rows) {
    let hide;
    if (row.kind === "node") hide = q ? !keepNodes.has(row.path) : row.parentPath != null && hiddenBy(row.parentPath);
    else hide = q ? !matches(row.rule) : hiddenBy(row.path);
    row.tr.classList.toggle("hidden", hide);
    if (row.kind === "rule") {
      $(".rule-title", row.tr).innerHTML = highlight(row.rule.title, q);
      $(".rule-text", row.tr).innerHTML = highlight(row.rule.rule ?? "", q);
      if (!hide && (row.rule.status !== "retired" || showRetired)) shown++;
    } else {
      const chev = $(".chev", row.tr);
      const isCollapsed = !q && collapsed.has(row.path);
      chev.classList.toggle("collapsed", isCollapsed);
      if (chev.tagName === "BUTTON") chev.setAttribute("aria-expanded", String(!isCollapsed));
    }
  }
  if (openDetail && openDetail.previousElementSibling?.classList.contains("hidden")) closeDetail();
  $("#table-count").textContent = q ? `${shown} matching rule${shown === 1 ? "" : "s"}` : `${shown} rule${shown === 1 ? "" : "s"}`;
}

function closeDetail() {
  openDetail?.remove();
  openDetail = null;
}

function toggleDetail(row) {
  const wasOpen = openDetail?.previousElementSibling === row.tr;
  closeDetail();
  if (wasOpen) return;
  const r = row.rule;
  const tr = document.createElement("tr");
  tr.className = "detail";
  tr.innerHTML = `<td colspan="5"><div class="detail-body" style="margin-left:${row.depth * 20 + 22}px">
    ${r.rule ? `<div>${inline(r.rule)}</div>` : ""}
    ${r.why ? `<div class="muted"><strong>Why:</strong> ${inline(r.why)}</div>` : ""}
    ${r.examples.length ? `<ul>${r.examples.map((e) => `<li>${inline(e)}</li>`).join("")}</ul>` : ""}
    ${r.history.length ? `<div class="history">${r.history.map(inline).join("<br>")}</div>` : ""}
    <div><a href="#rule=${encodeURIComponent(r.id)}" data-map-rule="${esc(r.id)}">View on map →</a></div>
  </div></td>`;
  row.tr.after(tr);
  openDetail = tr;
}

tbody.addEventListener("click", (e) => {
  const mapLink = e.target.closest("[data-map-rule]");
  if (mapLink) {
    e.preventDefault();
    setView("map", `rule=${mapLink.dataset.mapRule}`);
    return;
  }
  const tr = e.target.closest("tr");
  const row = rows.find((r) => r.tr === tr);
  if (!row) return;
  if (row.kind === "node") {
    if (!e.target.closest(".chev")) return;
    collapsed.has(row.path) ? collapsed.delete(row.path) : collapsed.add(row.path);
    renderTable();
  } else toggleDetail(row);
});
$("#filter").addEventListener("input", renderTable);
$("#expand-all").addEventListener("click", () => { collapsed.clear(); renderTable(); });
$("#collapse-all").addEventListener("click", () => {
  rows.filter((r) => r.kind === "node" && r.path !== "").forEach((r) => collapsed.add(r.path));
  renderTable();
});

// ---------- Views ----------

let view = "map";
function setView(next, hash) {
  view = next;
  document.body.classList.toggle("view-map", next === "map");
  document.body.classList.toggle("view-table", next === "table");
  $("#tab-map").setAttribute("aria-selected", String(next === "map"));
  $("#tab-table").setAttribute("aria-selected", String(next === "table"));
  const url = new URL(location.href);
  if (next === "table") url.searchParams.set("view", "hierarchy");
  else url.searchParams.delete("view");
  if (hash !== undefined) url.hash = hash;
  history.replaceState(null, "", url);
  if (next === "map") {
    layout(world.firstElementChild);
    fromHash({ animate: false });
  } else renderTable();
}
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
$("#show-retired").addEventListener("change", () => view === "table" && renderTable());

// ---------- Boot ----------

$("#repo").textContent = DATA.repo;
$("#repo").href = `/r/${encodeURIComponent(DATA.repo)}`;
$("#label").textContent = DATA.label ?? "";
document.title = `${DATA.repo} · Rules`;
world.append(renderNode(DATA.tree, 0, HUES[0]));
buildTable();
setView(new URLSearchParams(location.search).get("view") === "hierarchy" ? "table" : "map");
</script>
</body>
</html>
