<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wit</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --sunken: #f0efea; --text: #1d1d1b; --muted: #6b6b66; --border: #e2e2dc;
    --accent: #2f5bd3; --ok: #1e6b34; --ok-bg: #e6f4ea; --warn: #8a5a00; --bad: #a4291b; --bad-bg: #fbe9e7;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --surface: #1f1f1d; --sunken: #191918; --text: #ececE8; --muted: #9a9a93; --border: #33332f;
      --accent: #7d9cff; --ok: #8fdca8; --ok-bg: #173323; --warn: #e8bb5a; --bad: #f2a193; --bad-bg: #3a1a16;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; }
  header .inner { max-width: 980px; margin: 0 auto; display: flex; gap: 16px; align-items: baseline; }
  header .brand { font-weight: 800; font-size: 18px; color: var(--text); }
  header .crumb { color: var(--muted); }
  header .passkey { margin-left: auto; font-size: 13px; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 32px 0 10px; }
  .lede { color: var(--muted); margin: 0 0 12px; }
  .stats { display: flex; gap: 20px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
  .stats strong { color: var(--text); }
  .actions { display: flex; gap: 10px; margin: 16px 0 0; flex-wrap: wrap; }
  .btn { display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 400; }
  .btn:hover { text-decoration: none; filter: brightness(1.05); }
  .list { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .item { display: flex; gap: 12px; align-items: baseline; padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .item:first-child { border-top: 0; }
  .item .main { flex: 1; min-width: 200px; }
  .item .title { font-weight: 600; }
  .item .sub { color: var(--muted); font-size: 13px; }
  .pill { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .pill.open { color: var(--accent); } .pill.merged { color: var(--ok); } .pill.abandoned { color: var(--muted); }
  .pill.changes_requested { color: var(--warn); } .pill.superseded { color: var(--muted); }
  .rev { font: 12px ui-monospace, Menlo, monospace; color: var(--warn); white-space: nowrap; }
  .sig-ok { color: var(--ok); font-size: 13px; white-space: nowrap; } .sig-bad { color: var(--bad); font-size: 13px; white-space: nowrap; }
  .empty { color: var(--muted); padding: 24px 16px; text-align: center; }
  .notice { border-radius: 8px; padding: 12px 16px; margin: 0 0 20px; background: var(--bad-bg); color: var(--bad); }
  .notice.ok { background: var(--ok-bg); color: var(--ok); }
  .setup { max-width: 560px; }
  .setup ol { padding-left: 20px; color: var(--muted); }
</style>
</head>
<body>
<header><div class="inner">
  <a class="brand" href="/">wit</a>
  <span class="crumb" id="crumb"></span>
  <span class="passkey" id="passkey"></span>
</div></header>
<main id="app"><p class="empty">Loading…</p></main>
<script>
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const when = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
const api = async (method, path, body) => {
  const res = await fetch(path, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
};
const toBuf = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
const toB64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function passkeyBadge() {
  const { registered } = await api("GET", "/api/setup");
  $("#passkey").innerHTML = registered ? `<span class="sig-ok">🔑 Passkey set up</span>` : `<a href="/setup">Set up your passkey →</a>`;
  return registered;
}

async function home() {
  document.title = "wit";
  const repos = await api("GET", "/api/repos");
  $("#app").innerHTML = `
    <h1>Repos</h1>
    <p class="lede">Every repo tracked by wit on this machine. Create one with <code>wit init</code>.</p>
    <div class="list">${repos.map((r) => `
      <a class="item" href="/r/${encodeURIComponent(r.name)}">
        <div class="main"><div class="title">${esc(r.title ?? r.name)} <span class="sub">${esc(r.name)}</span></div><div class="sub">${esc(r.summary)}</div></div>
        <span class="sub">${r.openBranches} open branch${r.openBranches === 1 ? "" : "es"}</span>
        ${r.openReviews ? `<span class="pill open">${plural(r.openReviews, "review")}</span>` : ""}
        <span class="rev">main r${r.mainRev}</span>
      </a>`).join("") || `<p class="empty">No repos yet. Run <code>wit init</code> in a folder.</p>`}</div>`;
}

async function repo(name) {
  const r = await api("GET", `/api/repos/${encodeURIComponent(name)}`);
  document.title = `${r.name} · wit`;
  $("#crumb").innerHTML = `/ <a href="/r/${encodeURIComponent(r.name)}">${esc(r.name)}</a>`;
  const open = r.branches.filter((b) => b.status === "open");
  const closed = r.branches.filter((b) => b.status !== "open");
  const branchRow = (b) => `
    <div class="item">
      <div class="main"><div class="title">${esc(b.name)}</div><div class="sub">${esc(b.description)} · ${plural(b.revisions, "revision")} · started ${when(b.created_at)}</div></div>
      ${b.review ? `<a href="/r/${encodeURIComponent(r.name)}/reviews/${b.review.id}">Review #${b.review.id}</a> <span class="pill ${b.review.status}">${b.review.status === "open" ? "awaiting review" : b.review.status.replace("_", " ")}</span>` : b.status === "open" ? `<span class="sub">not reviewed yet</span>` : ""}
      ${b.status === "open" ? "" : `<span class="pill ${b.status}">${b.status}</span>`}
      <a class="sub" href="/r/${encodeURIComponent(r.name)}/map?branch=${encodeURIComponent(b.name)}">map</a>
    </div>`;
  $("#app").innerHTML = `
    <h1>${esc(r.title ?? r.name)}</h1>
    <p class="lede">${esc(r.summary)}</p>
    <div class="stats"><span><strong>${r.ruleCount}</strong> active rules</span><span><strong>${r.nodeCount}</strong> nodes</span><span>main at <strong>r${r.mainRev}</strong></span></div>
    <div class="actions"><a class="btn" href="/r/${encodeURIComponent(r.name)}/map">Open the map</a></div>
    ${r.passkey ? "" : `<div class="notice" style="margin-top:20px">No passkey yet, so nothing can be merged. <a href="/setup">Set one up</a>.</div>`}
    <h2>Open branches</h2>
    <div class="list">${open.map(branchRow).join("") || `<p class="empty">None. Start one with <code>wit start "…"</code>.</p>`}</div>
    <h2>History of main</h2>
    <div class="list">${r.history.map((h) => `
      <div class="item">
        <span class="rev">r${h.id}</span>
        <div class="main"><div class="title">${esc(h.message.split("\n")[0])}</div><div class="sub">${esc(h.author)} · ${when(h.created_at)}</div></div>
        ${h.signed === true ? `<span class="sig-ok">✓ signed by your passkey</span>` : h.signed === false ? `<span class="sig-bad">✗ signature invalid</span>` : h.mergedFrom ? `<span class="sig-bad">unsigned</span>` : ""}
      </div>`).join("")}</div>
    ${closed.length ? `<h2>Closed branches</h2><div class="list">${closed.map(branchRow).join("")}</div>` : ""}`;
}

async function setup() {
  document.title = "Passkey · wit";
  const { registered } = await api("GET", "/api/setup");
  if (registered) {
    $("#app").innerHTML = `<div class="setup"><h1>Passkey</h1><div class="notice ok">Your passkey is set up. Merging into main requires it.</div><p class="lede">wit supports one owner passkey. To replace it, delete it from <code>data/wit.db</code> in the wit repo (table <code>credentials</code>) and come back here.</p></div>`;
    return;
  }
  $("#app").innerHTML = `
    <div class="setup">
      <h1>Set up your passkey</h1>
      <p class="lede">Approving a review merges it into main. That requires a signature from this passkey, over exactly the revision you reviewed. Claude can use every other part of wit, but it can't produce that signature.</p>
      <ol><li>Click the button and confirm with Touch ID, a security key, or your device PIN.</li><li>Do this yourself, in your own browser. Whoever registers first becomes the owner.</li></ol>
      <button class="btn" id="register">Create passkey</button>
      <p id="msg" class="sub"></p>
    </div>`;
  $("#register").addEventListener("click", async () => {
    try {
      const { challenge, rpId, userId } = await api("POST", "/api/setup/challenge");
      const cred = await navigator.credentials.create({ publicKey: {
        challenge: toBuf(challenge),
        rp: { name: "wit", id: rpId },
        user: { id: toBuf(userId), name: "wit owner", displayName: "wit owner" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { userVerification: "required", residentKey: "preferred" },
        attestation: "none",
        timeout: 60000,
      } });
      const publicKey = cred.response.getPublicKey?.();
      if (!publicKey) throw new Error("This browser can't export the passkey's public key. Try a recent Chrome or Safari.");
      await api("POST", "/api/setup/register", {
        id: toB64url(cred.rawId),
        publicKey: toB64url(publicKey),
        alg: cred.response.getPublicKeyAlgorithm(),
        clientDataJSON: toB64url(cred.response.clientDataJSON),
      });
      await passkeyBadge();
      await setup();
    } catch (err) {
      $("#msg").textContent = `Couldn't register: ${err.message}`;
    }
  });
}

async function route() {
  if (location.hostname !== "localhost") {
    location.replace(location.href.replace(location.hostname, "localhost"));
    return;
  }
  await passkeyBadge();
  const parts = location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
  if (parts[0] === "setup") return setup();
  if (parts[0] === "r" && parts[1]) return repo(parts[1]);
  return home();
}
route().catch((err) => { $("#app").innerHTML = `<p class="empty">${esc(err.message)}</p>`; });
</script>
</body>
</html>
