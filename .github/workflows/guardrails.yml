name: guardrails

# Reusable workflow. Product repos call it from a pull_request_target workflow, pinned to
# a commit SHA of this repo, so the checks live outside the repo they judge.
# See skills/init/templates/.github/workflows/guardrails.yml for the caller.
#
# SECURITY: this never checks out the product repo. Danger reads the PR through the API.
on:
  workflow_call:
    inputs:
      tool-repository:
        description: This repo (owner/name). Must match the repo in the caller's `uses:`.
        required: true
        type: string
      tool-ref:
        description: The commit SHA of this repo to run. Must match the SHA in the caller's `uses:`.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.tool-repository }}
          ref: ${{ inputs.tool-ref }}
          path: tool
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        working-directory: tool/guardrails
      - run: npx danger ci --dangerfile dangerfile.js --failOnErrors
        working-directory: tool/guardrails
        env:
          DANGER_GITHUB_API_TOKEN: ${{ github.token }}
